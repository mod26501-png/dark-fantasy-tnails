    <style>
      body {
        background-color: #0b0b0f;
        margin: 0;
        padding: 0;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      /* === BASE TITLE (PREMIUM ABYSSAL CHROME & POINTED SPIKES) === */
      .codex-title {
        font-family: 'New Rocker', 'Metal Mania', cursive;
        text-transform: uppercase;
        color: #fff;
        letter-spacing: 0.05em;
        margin-top: 40px;
        margin-bottom: 30px;
        /* Ultimate Chrome Split-Horizon Gradient with razor-sharp reflection line */
        background: linear-gradient(180deg, 
          #ffffff 0%, 
          #ffffff 45%, 
          #e2e8f0 49%, 
          #0b1329 50%, 
          #1e293b 52%, 
          #0f172a 65%, 
          #475569 80%, 
          #ffffff 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        position: relative;
        display: inline-block;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.9));
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.4);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
        pointer-events: auto !important;
      }

      /* === VIOLENT RED AURA & HOVER STATE === */
      .codex-title:hover {
        filter: drop-shadow(0 0 12px #ff0000) drop-shadow(0 0 25px rgba(141, 26, 26, 1)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.95));
        transform: scale(1.06) translateY(-4px);
        -webkit-text-stroke: 1.2px rgba(255, 0, 0, 0.6);
      }

      .codex-title::after {
        content: attr(data-text);
        position: absolute;
        left: 0;
        top: 0;
        z-index: -1;
        /* Outer thick metal border and red ambient shadow */
        -webkit-text-stroke: 4px #020617;
        filter: drop-shadow(0 0 12px rgba(141, 26, 26, 0.7));
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .codex-title:hover::after {
        -webkit-text-stroke: 4px #8d1a1a;
        filter: drop-shadow(0 0 22px #ff0000);
      }

      /* === RUNE FLARE CONTAINER === */
      .codex-title .rune {
        position: absolute;
        font-size: 24px;
        color: #ff0000;
        opacity: 0;
        pointer-events: none;
        text-shadow:
          0 0 8px #ff0000,
          0 0 16px #ff3333,
          0 0 24px #ff6666;
        transition: opacity 0.4s ease;
        z-index: 10;
        font-family: 'New Rocker', serif;
      }

      /* === RUNE POSITIONS (4 cardinal points) === */
      .codex-title .rune:nth-of-type(1) { top: -35px; left: 50%; transform: translateX(-50%); }
      .codex-title .rune:nth-of-type(2) { bottom: -35px; left: 50%; transform: translateX(-50%); }
      .codex-title .rune:nth-of-type(3) { left: -35px; top: 50%; transform: translateY(-50%); }
      .codex-title .rune:nth-of-type(4) { right: -35px; top: 50%; transform: translateY(-50%); }

      /* === RUNE IGNITION ON HOVER === */
      .codex-title:hover .rune {
        opacity: 1;
        animation: runeOrbit 2.4s linear infinite;
      }

      /* === ORBIT ANIMATION === */
      @keyframes runeOrbit {
        0%   { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }

      /* Global Blood Glow Hover Effect */
      button, a, select, textarea, input, .hover-blood {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      
      .hover-blood:hover, button.hover-blood:hover, a.hover-blood:hover {
        box-shadow: 0 0 30px 5px rgba(255, 0, 0, 0.8) !important;
        border-color: #ff0000 !important;
        background-color: rgba(141, 26, 26, 0.2) !important;
        transform: translateY(-2px) scale(1.02);
        z-index: 50;
      }

      /* Blood Drip Animation - Activates fully on title hover */
      .blood-drop {
        position: absolute;
        background: #ff0000;
        width: 4px;
        height: 6px;
        border-radius: 50%;
        bottom: -8px;
        left: var(--drop-left);
        animation: drip var(--drop-duration) infinite linear;
        box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        pointer-events: none;
        opacity: 0.15;
        transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.3s ease;
      }

      .codex-title:hover .blood-drop {
        opacity: 1;
        background: #ff0000;
        box-shadow: 0 0 15px #ff0000, 0 0 30px #ff3333;
      }

      @keyframes drip {
        0% { transform: translateY(0) scaleX(1); opacity: 1; }
        30% { transform: translateY(12px) scaleX(1.3); }
        85% { transform: translateY(120px) scaleX(0.7); opacity: 1; }
        100% { transform: translateY(180px) scaleX(0.4); opacity: 0; }
      }

      /* Lightning Blue Text Style */
      .lightning-text {
        color: #fff;
        text-shadow: 
          0 0 5px #fff,
          0 0 10px #00d2ff,
          0 0 20px #00d2ff,
          0 0 40px #008cff;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      /* === LOGO & WRAPPER STYLES === */
      .codex-title-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        position: relative;
        width: 100%;
        margin-top: 40px;
        margin-bottom: 30px;
      }
      .codex-sublogo {
        width: 140px; /* adjust to taste */
        display: block;
        margin: 0 auto;
        opacity: 0.95;

        /* steady glow */
        filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.35))
                drop-shadow(0 0 12px rgba(255, 0, 0, 0.15));

        transition: 
          filter 0.35s ease,
          transform 0.35s ease,
          opacity 0.35s ease;
      }

      .codex-sublogo:hover {
        /* hover flare */
        filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.9))
                drop-shadow(0 0 24px rgba(255, 0, 0, 0.6))
                drop-shadow(0 0 36px rgba(255, 0, 0, 0.4));

        transform: scale(1.05);
        opacity: 1;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('/demon-ai-1782459263710.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.15;
        z-index: -1;
        pointer-events: none;
      }

      @media print {
        body {
          background-color: white !important;
          color: black !important;
        }
        .no-print {
            display: none !important;
        }
      }

      /* Angelic Agent Styling & Keyframes */
      .angelic-agent, .angelic {
        color: #ffd27f;
        text-shadow: 0 0 12px rgba(255, 215, 100, 0.8);
        animation: angelicPulse 1.6s infinite ease-in-out;
        cursor: pointer;
      }

      @keyframes angelicPulse {
        0% { text-shadow: 0 0 8px rgba(255, 215, 100, 0.6); }
        50% { text-shadow: 0 0 18px rgba(255, 255, 200, 1); }
        100% { text-shadow: 0 0 6px rgba(255, 215, 100, 0.5); }
      }
    </style>
